intro: Membership is arranged directly with the society through WhatsApp. Message our membership contact and we'll guide you through the next steps.
eligibility: Anyone is welcome to join — you don't need to be Scottish, just to enjoy Scotland, its culture and good company.
period: Membership runs for the calendar year, January to December.
renewal: Renewals are due from 1 January each year.
how_to_join: Tap 'Join via WhatsApp' to send us a message. We'll reply with the next steps.
options:
  - name: Society membership
    price_aed: AED 100
    description: ''
benefits:
  - title: A warm Scottish welcome
    description: "Become part of Abu Dhabi's vibrant Scottish community, where new faces become familiar friends. Whether Scotland is home or simply close to your heart, join us for friendship, shared traditions and good company."
  - title: First access and reduced rates for events
    description: "Be first to reserve your place at all Society events, with priority booking and member prices on tickets. From lively celebrations to relaxed social gatherings, there's plenty to look forward to and a friendly crowd to enjoy it with."
  - title: Help keep our traditions thriving
    description: "Your membership helps the Society bring people together and celebrate Scottish culture in Abu Dhabi. Be part of keeping those traditions alive and sharing them with the next generation."
  - title: Member discounts
    description: "Enjoy discounts with the retail, food and drink partners that support the Society, giving you more value from your membership while supporting our wider community."
home_note: Discover more about membership and how to become part of the Scottish Society Abu Dhabi.
home_button: Click here to find out more
whatsapp_number: '+971 50 837 6604'
whatsapp_message: Hi, I'd like to join the Scottish Society Abu Dhabi. Could you please let me know the next steps?
email: committee@adscottishsociety.com
faq:
  - question: Who can join?
    answer: Anyone — you don't need to be Scottish. Members include Scots, their families and friends, and plenty of people who simply love Scotland.
  - question: How long does membership last?
    answer: Membership runs for the calendar year, January to December, and renews from 1 January.
  - question: How do I join?
    answer: Send us a message using the 'Join via WhatsApp' button and we'll take it from there.
  - question: How do I renew?
    answer: Renewals are due from 1 January each year — message us on WhatsApp or email committee@adscottishsociety.com and we'll sort it out.
